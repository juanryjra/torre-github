<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Torre de la Evaluación</title>
<meta name="description" content="Escape room interactivo sobre evaluación para el aprendizaje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: una torre oscura que se sube piso a piso. HUD fijo arriba, guardián a la izquierda y reto a la derecha; se apilan en móvil. Tema único oscuro, a propósito. */
:root{
  --bg:#0c0b12; --bg2:#13111c; --panel:#1a1726; --panel2:#221e31; --line:#3a3350;
  --fg:#ebe4d6; --muted:#a49cb5; --gold:#d6b36a; --gold2:#f3d998; --violet:#9d7bff; --teal:#5fd4cf;
  --ok:#62d48d; --bad:#ff6b6b; --warn:#ffb454;
  --f-title:"Cinzel Decorative","Cinzel",Georgia,serif; --f-head:"Cinzel",Georgia,serif; --f-body:"Alegreya",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a1f45 0%,transparent 60%),radial-gradient(900px 500px at 0% 110%,#1d2a33 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:18px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
#app{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;overflow-wrap:break-word;margin:0;font-weight:700;letter-spacing:.02em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.screen{display:grid;gap:24px}
.label{font-family:var(--f-head);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:linear-gradient(180deg,#3b2f17,#241c0e);color:var(--gold2);font-family:var(--f-head);font-weight:700;letter-spacing:.06em;padding:12px 22px;border-radius:6px;transition:transform .12s,box-shadow .2s}
.btn:hover{box-shadow:0 0 18px rgba(214,179,106,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.small{padding:7px 12px;font-size:.8rem}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.field{display:grid;gap:6px}
.field input,.field textarea,select{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:11px 12px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.note{font-size:.88rem;color:var(--muted)}
.err{color:var(--bad);font-size:.92rem;min-height:1.3em}

/* ---------- Portada ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
.hero-title{font-family:var(--f-title);font-weight:900;font-size:clamp(2.1rem,5.4vw,3.9rem);line-height:1.05;color:var(--gold2);text-shadow:0 0 28px rgba(157,123,255,.35)}
.hero-title span{display:block;font-size:.42em;letter-spacing:.32em;color:var(--violet);font-family:var(--f-head);margin-bottom:10px;text-shadow:none}
.lore{max-width:62ch;color:#d9d1c2}
.portal{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2);display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr)}
.portal img{display:block;width:100%;height:100%;object-fit:cover}
.portal .cap{padding:14px 16px;font-size:.95rem;align-self:center}
.reg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:14px}
.resume{border:1px solid var(--teal);border-radius:10px;padding:14px 16px;background:rgba(95,212,207,.07);display:grid;gap:10px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rule{border-top:1px solid var(--line);padding-top:10px;font-size:.95rem}
.rule b{display:block;font-family:var(--f-head);color:var(--gold);font-size:.82rem;letter-spacing:.08em}
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.board ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto auto;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding:4px 0;font-variant-numeric:tabular-nums}
.board li .n{font-family:var(--f-head);color:var(--gold)}
.board li .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .who small{color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}

/* (sin torre) */

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,11,18,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:8px 20px;align-items:center}
.hud .who{min-width:0;flex:0 1 220px}
.hud .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-extra{display:flex;gap:8px 14px;align-items:center;flex:1;min-width:0}
.hud2{display:none}
.iconbtn{white-space:nowrap}
.hud .stat{display:grid;line-height:1.15}
.hud .stat b{font-family:var(--f-head);font-size:1.05rem;font-variant-numeric:tabular-nums}
.hud .timer b{font-size:1.35rem;color:var(--teal)}
.hud .timer.low b{color:var(--bad);animation:pulse 1s infinite}
.hearts{display:flex;gap:4px;padding-top:3px}
.heart{width:20px;height:18px;position:relative}
.heart::before,.heart::after{content:"";position:absolute;top:0;width:10px;height:16px;border-radius:10px 10px 0 0;background:var(--bad)}
.heart::before{left:10px;transform:rotate(-45deg);transform-origin:0 100%}
.heart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
.heart.off::before,.heart.off::after{background:#3a3248}
.steps{display:flex;gap:5px;padding-top:6px}
.steps i{width:22px;height:6px;border-radius:3px;background:#2b2540}
.steps i.done{background:var(--gold)}
.steps i.now{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 11px;font-family:var(--f-head);font-size:.8rem}
.syls{display:flex;gap:5px;flex-wrap:wrap;padding-top:2px}
.syl{font-family:var(--f-title);font-weight:900;font-size:.82rem;padding:3px 8px;border-radius:5px;border:1px solid var(--gold);color:#2b1f08;background:linear-gradient(180deg,#f3d998,#c9a04f)}
.syl.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* ---------- Escena ---------- */
.scene{display:grid;grid-template-columns:clamp(210px,24vw,300px) minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:96px;display:grid;gap:16px}
.board.mini{padding:14px 16px;font-size:.92rem}
.board li .t{color:var(--muted);font-size:.85em}
.guard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.guard img{display:block;width:100%;height:auto;aspect-ratio:300/380;object-fit:cover;object-position:top}
.guard .gtxt{padding:14px 16px 18px;display:grid;gap:8px}
.guard h3{color:var(--gold2);font-size:1.05rem}
.speech{font-style:italic;color:#d8d0e6;font-size:.98rem;margin:0}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:18px;min-width:0}
.stage h2{font-size:clamp(1.3rem,2.6vw,1.75rem);color:var(--gold2)}
.floor{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-head);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);border:1px solid #2d4a50;border-radius:999px;padding:3px 12px;justify-self:start}
.part{display:grid;gap:14px}
.part p{margin:0}
.feedback{padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);font-size:.98rem}
.feedback.ok{border-color:var(--ok);color:var(--ok)}
.feedback.bad{border-color:var(--bad);color:#ffb3b3}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hintbox{border-left:3px solid var(--violet);padding:8px 12px;background:rgba(157,123,255,.08);font-size:.95rem}
.casebox{border:1px solid #2d4a50;border-radius:8px;padding:12px 14px;background:rgba(95,212,207,.06)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* pergamino */
.scroll{margin:0;background:linear-gradient(180deg,#f3e6c4,#e8d6a8);color:#2b2112;border-radius:6px;padding:20px 22px;line-height:2.3;font-size:1.05rem;box-shadow:inset 0 0 30px rgba(120,80,20,.25)}
.scroll select{display:inline-block;width:auto;max-width:100%;background:#fff8e6;color:#2b2112;border:1px solid #9c7a3c;padding:3px 8px;margin:2px 0;font-weight:600}
.scroll footer{margin-top:8px;font-size:.85rem;font-style:italic;line-height:1.4;color:#5a4320}
/* sellos */
.seals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.seal-b{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 35% 30%,#3a3050,#1c1828);font-family:var(--f-head);font-weight:700;font-size:clamp(.62rem,1.6vw,.85rem);letter-spacing:.04em;padding:6px;max-width:130px;width:100%;justify-self:center}
.seal-b.on{border-color:var(--gold2);background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b650 45%,#8a6420 80%);color:#3a2808;box-shadow:0 0 18px rgba(243,217,152,.5)}

/* clasificación */
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.item p{margin:0}
.item select{width:auto;min-width:170px;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-family:var(--f-head);font-size:.8rem;letter-spacing:.05em}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--gold);color:#1c150a}
.seg.v button.on[data-v="F"]{background:var(--teal)}
.seg.v button.on[data-v="S"]{background:var(--violet);color:#fff}
.mcq{display:grid;gap:8px;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;margin:0;min-width:0}
.mcq label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px;border-radius:6px;cursor:pointer}
.mcq label:hover{background:rgba(255,255,255,.04)}
.mcq input{margin-top:6px;accent-color:var(--gold)}

/* engranajes */
.gears{display:grid;gap:8px}
.gear{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.gear .pos{font-family:var(--f-head);color:var(--gold);font-size:1.1rem;text-align:center}
.gear .ctr{display:flex;gap:4px}
.gear .ctr button{border:1px solid var(--line);background:var(--panel2);border-radius:5px;width:34px;height:34px}
.gear .ctr button.x{width:auto;padding:0 8px;font-size:.78rem;font-family:var(--f-head)}
.discard{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;min-height:56px}
.discard .gear{opacity:.7}

/* runas */
.runes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rune{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:16px 10px;font-family:var(--f-head);font-weight:700;display:grid;gap:6px;justify-items:center;text-align:center;font-size:.9rem}
.rune .glyph{font-size:1.8rem;color:var(--violet)}
.rune.lit{border-color:var(--gold);box-shadow:0 0 16px rgba(214,179,106,.4)}
.rune.lit .glyph{color:var(--gold2)}
.rune .ord{font-size:.75rem;color:var(--gold)}

/* dados */
.dicebox{display:grid;gap:14px;justify-items:center;padding:16px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(circle at 50% 0,#2a2340,var(--bg2))}
.die-wrap{perspective:600px;width:76px;height:76px;margin:10px}
.die{width:76px;height:76px;position:relative;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.2,.75,.25,1)}
.die .f{position:absolute;inset:0;border-radius:13px;background:linear-gradient(145deg,#fbf3dc,#e4d3a6);border:2px solid #b89b5e;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;backface-visibility:hidden}
.die .f i{width:12px;height:12px;border-radius:50%;background:#2a1f45;place-self:center}
.die .f i.o{background:transparent}
.die .f1{transform:translateZ(38px)}.die .f6{transform:rotateY(180deg) translateZ(38px)}
.die .f2{transform:rotateY(90deg) translateZ(38px)}.die .f5{transform:rotateY(-90deg) translateZ(38px)}
.die .f3{transform:rotateX(90deg) translateZ(38px)}.die .f4{transform:rotateX(-90deg) translateZ(38px)}
.faces-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:.88rem;color:var(--muted);width:100%}
.faces-key b{color:var(--gold);font-family:var(--f-head)}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);display:block}
.pips i.on{background:var(--gold2);box-shadow:0 0 10px var(--gold2)}
.choices{display:grid;gap:8px;width:100%}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:12px 14px}
.choice:hover{border-color:var(--gold)}

/* cerradura */
.lock{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.dial{display:grid;gap:6px;justify-items:center}
.dial button{width:52px;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:6px}
.dial .d{width:64px;height:78px;display:grid;place-items:center;font-family:var(--f-title);font-size:2.3rem;color:var(--teal);background:#0a0f13;border:2px solid #2d4a50;border-radius:10px;box-shadow:inset 0 0 18px rgba(95,212,207,.25);font-variant-numeric:tabular-nums}
.wordslot{min-height:58px;border:2px dashed var(--gold);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:rgba(214,179,106,.06)}
.wordslot .syl,.sylbank .syl{font-size:1.15rem;padding:8px 14px}
.sylbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sylbank button.syl:disabled{opacity:.25}

/* grimorio */
.grimoire{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,env(safe-area-inset-right,0px));width:min(430px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:#17131f;border:1px solid var(--gold);border-radius:10px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:grid;gap:12px}
.grimoire ol{margin:0;padding-left:1.3em;display:grid;gap:10px}
.grimoire li::marker{color:var(--gold);font-family:var(--f-head)}

/* puertas */
.doors{position:fixed;inset:0;z-index:45;display:flex;overflow:hidden}
.doors .door{flex:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 64px),repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 120px),linear-gradient(180deg,#2b2638,#15121d);transition:transform 1s cubic-bezier(.7,0,.3,1) .75s;border-inline:3px solid #0a0810}
.doors.open{pointer-events:none}
.doors.open .l{transform:translateX(-101%)}.doors.open .r{transform:translateX(101%)}
.doors .doortxt{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:20px;transition:opacity .4s .6s}
.doors.open .doortxt{opacity:0}
.doors .doortxt b{font-family:var(--f-title);font-size:clamp(2.2rem,8vw,4.5rem);color:var(--gold2);text-shadow:0 0 30px rgba(243,217,152,.5)}
.doors .doortxt small{font-family:var(--f-head);font-size:1.05rem;color:var(--fg)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,9,.86);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{max-width:760px;width:100%;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:26px;display:grid;gap:16px;text-align:center;justify-items:center;box-shadow:0 0 60px rgba(157,123,255,.25)}
.modal h2{color:var(--gold2);font-family:var(--f-title);font-size:clamp(1.7rem,5vw,2.6rem)}
.bigpts{font-family:var(--f-title);font-weight:900;font-size:clamp(3.4rem,13vw,6.2rem);line-height:1;color:var(--gold2);text-shadow:0 0 40px rgba(243,217,152,.55);font-variant-numeric:tabular-nums;animation:pop .6s both}
.bigpts small{display:block;font-family:var(--f-head);font-size:.95rem;letter-spacing:.2em;color:var(--muted);text-shadow:none;margin-top:6px}
.celebgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;width:100%;text-align:left}
.cbox{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg2);display:grid;gap:8px;align-content:start}
.bigsyl{font-family:var(--f-title);font-weight:900;font-size:2.6rem;justify-self:center;padding:6px 22px;border-radius:10px;color:#2b1f08;background:linear-gradient(180deg,#fff3c4,#d9ae55);box-shadow:0 0 30px rgba(243,217,152,.55);animation:pop .7s .3s both}
.clue{border:1px dashed var(--gold);border-radius:8px;padding:12px 14px;background:rgba(214,179,106,.07);text-align:left;width:100%}
.clue p{margin:6px 0 0}

/* final */
.seal{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b650 40%,#8a6420 75%);box-shadow:0 0 50px rgba(243,217,152,.6),inset 0 -8px 20px rgba(0,0,0,.35);animation:glow 2.4s ease-in-out infinite;color:#4a3410;font-family:var(--f-title);font-weight:900;font-size:1.05rem;text-align:center;line-height:1.1;padding:20px}
@keyframes glow{50%{box-shadow:0 0 80px rgba(243,217,152,.9),inset 0 -8px 20px rgba(0,0,0,.35)}}
.win{display:grid;justify-items:center;text-align:center;gap:18px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:30px 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left}
.tile b{display:block;font-family:var(--f-head);font-size:1.6rem;color:var(--gold2);font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.quote{font-style:italic;color:#d8d0e6;max-width:44ch}

/* bonus: escalera */
.bonus-head{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.bonus-head>div{min-width:0}
.bonus-head img{border-radius:10px;border:1px solid var(--line)}
.stairs{display:grid;gap:14px}
.stair{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:18px 20px;display:grid;gap:10px}

<script>
const IMG = Object.fromEntries(["tiempo", "cronista", "duende", "inventor", "alquimista", "oraculo", "golem", "sombra", "elfa"].map(n => [n, 'img/' + n + '.jpg']));
const PASS = "santillana2026";
const TOTAL_SEC = 30 * 60;
const MAX_LIVES = 5;
const KEYWORD = 'APRENDIZAJE';
const CODE = '3536';

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmtTime = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const num = n => (Number(n)||0).toLocaleString('es-CO');
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- sonido (Web Audio, sin archivos) ---------------- */
const Sfx = (() => {
  let ctx = null, master = null, drone = null, muted = store.get('torre-mute') === '1';
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, dur, type='sine', vol=.25, when=0, slide=null){
    if (muted) return; const c = ac(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function startDrone(){
    if (muted || drone) return; const c = ac(); if (!c) return;
    const g = c.createGain(); g.gain.value = .0001; g.gain.exponentialRampToValueAtTime(.07, c.currentTime+3);
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 420;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .08; lg.gain.value = 160; lfo.connect(lg); lg.connect(lp.frequency);
    const os = [55, 82.4, 110.6].map((f,i)=>{ const o=c.createOscillator(); o.type = i===1?'triangle':'sawtooth'; o.frequency.value=f; o.detune.value = i*6; o.connect(lp); o.start(); return o; });
    lp.connect(g); g.connect(master); lfo.start();
    drone = {g, os, lfo};
  }
  function stopDrone(){ if (!drone) return; const c = ac(); const d = drone; drone = null; try { d.g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+.6); } catch(e){} setTimeout(()=>{ try { d.os.forEach(o=>o.stop()); d.lfo.stop(); } catch(e){} }, 800); }
  return {
    get muted(){ return muted; },
    toggle(){ muted = !muted; store.set('torre-mute', muted?'1':'0'); if (muted) stopDrone(); else if (S.running) startDrone(); return muted; },
    startDrone, stopDrone,
    click(){ tone(700,.07,'triangle',.12); },
    flip(){ tone(380,.12,'triangle',.14,0,720); },
    ok(){ [523,659,784].forEach((f,i)=>tone(f,.28,'triangle',.22,i*.08)); },
    bad(){ tone(196,.4,'sawtooth',.18,0,92); tone(147,.45,'square',.06,.05,70); },
    unlock(){ [392,523,659,784,1046].forEach((f,i)=>tone(f,.45,'triangle',.2,i*.1)); tone(1568,.9,'sine',.08,.5); },
    door(){ tone(70,1.3,'sawtooth',.16,.5,40); tone(95,1.1,'square',.05,.6,55); },
    dice(){ for (let i=0;i<9;i++) tone(500+Math.random()*900,.035,'square',.07,i*.11+Math.random()*.03); },
    coin(){ tone(988,.09,'square',.12); tone(1319,.35,'square',.12,.09); },
    tick(){ tone(1250,.04,'square',.06); },
    gameover(){ [392,330,262,196,131].forEach((f,i)=>tone(f,.55,'sawtooth',.14,i*.22)); },
    win(){ const m=[[523,0],[659,.14],[784,.28],[1046,.42],[784,.62],[1046,.76],[1318,.95]]; m.forEach(([f,t])=>{ tone(f,.5,'triangle',.22,t); tone(f/2,.5,'sine',.1,t); }); tone(1568,1.6,'sine',.1,1.2); }
  };
})();

/* ---------------- registro compartido ---------------- */
let players = [];
function onPlayers(){
  renderBoard(); checkGifts();
  const n = $('#reg-note'); if (n) n.textContent = regNote();
  const typing = document.activeElement && document.activeElement.id === 't-filter';
  if (S.view === 'teacher' && S.teacherOk && !S.confirming && !typing) renderTeacher();
}
const Backend = (() => {
  const API = String((window.TORRE_CONFIG && window.TORRE_CONFIG.urlRegistro) || '').trim();
  const LOCAL_KEY = 'torre-jugadores';
  const NUMS = ['puntos','mejorPuntaje','retoActual','retosSuperados','reinicios','tiempoSeg','bonoTiempo','vidasExtra'];
  let q = Promise.resolve();
  const localAll = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); } catch(e){ return {}; } };
  const localPut = all => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all)); } catch(e){} };
  async function post(body){
    const r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error'); return j;
  }
  const normP = p => { NUMS.forEach(k => p[k] = Number(p[k]) || 0); ['id','nombre','grupo','estado','compromiso','inicio','fin','actualizado'].forEach(k => p[k] = p[k] == null ? '' : String(p[k])); return p; };
  async function refresh(){
    try {
      let list;
      if (!API) list = Object.values(localAll());
      else { const r = await fetch(API + (API.includes('?') ? '&' : '?') + 't=' + Date.now()); const j = await r.json(); list = j.jugadores || []; }
      players = list.map(normP); onPlayers();
    } catch(e){ console.warn('lectura', e); }
  }
  setTimeout(refresh, 0);
  setInterval(() => { if (['intro','teacher','win','game'].includes(S.view) && !document.hidden) refresh(); }, 10000);
  return {
    shared: !!API, canDownload: true, canPrint: true,
    offlineNote: 'Modo de prueba: el registro compartido aún no está configurado en config.js, así que los puntajes solo se guardan en este dispositivo.',
    liveNote: 'Se actualiza cada 10 segundos.',
    save(id, body){
      if (!API){ const all = localAll(); all[id] = Object.assign(all[id] || { id }, body); localPut(all); refresh(); return; }
      q = q.then(() => post({ action:'upsert', id, data: body })).catch(e => console.warn('registro', e));
    },
    async remove(id, clave){
      if (!API){ const all = localAll(); delete all[id]; localPut(all); return; }
      await post({ action:'delete', id, clave });
    },
    async download(name, text){
      const url = URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    },
    refresh
  };
})();

function saveRemote(patch, create){
  if (!S.docId) return;
  Backend.save(S.docId, Object.assign({}, patch, { actualizado: new Date().toISOString() }), !!create);
}
const regNote = () => Backend.shared ? 'Tu puntaje quedará registrado en el panel docente.' : Backend.offlineNote;

/* ---------------- personajes ---------------- */
const GUARD = {
  tiempo:{name:'Cronos, Guardián del Reloj'},
  cronista:{name:'La Cronista de la Memoria'},
  duende:{name:'Grimbol, el Embaucador de Mitos'},
  inventor:{name:'Maese Engranaje'},
  alquimista:{name:'Veridián, el Alquimista'},
  oraculo:{name:'Selene, Oráculo de la Escalera'},
  golem:{name:'Petra, la Cerradura Viviente'},
  sombra:{name:'La Sombra del Juicio'},
  elfa:{name:'Lía, Guardiana del Jardín'}
};

/* ---------------- estado ---------------- */
const S = { view:'intro', running:false, dead:false, token:0, docId:null, nombre:'', grupo:'', reto:0, score:0, lives:MAX_LIVES, livesLost:0, hintUsed:false, restarts:0,
  clues:[], syls:[], giftsSeen:0, pendingLives:0, runStart:0, pausedMs:0, pauseAt:0, timer:null, bestScore:0, teacherOk:false, teacherKey:'', confirming:false, filter:'', sort:{k:'mejorPuntaje',dir:-1}, finalSec:0, lastScore:0, phrase:'' };

function saveRun(){
  if (!S.docId || !S.running) return;
  if (S.pendingNext && S.reto >= RETOS.length - 1) return;
  store.set('torre-run', JSON.stringify({ docId:S.docId, nombre:S.nombre, grupo:S.grupo, reto:S.reto + (S.pendingNext ? 1 : 0), score:S.score, clues:S.clues, syls:S.syls, restarts:S.restarts, bestScore:S.bestScore, giftsSeen:S.giftsSeen, pendingLives:S.pendingLives, elapsed:elapsed(), ts:Date.now() }));
}
function loadRun(){
  try { const r = JSON.parse(store.get('torre-run') || 'null'); if (r && r.docId && Date.now() - r.ts < 3*3600*1000 && r.elapsed < TOTAL_SEC - 30 && r.reto < 6) return r; } catch(e){}
  return null;
}

/* ---------------- dado 3D ---------------- */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DIE_ROT = {1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]};
function makeDie(){
  const die = h('div',{class:'die'}, [1,2,3,4,5,6].map(n => h('div',{class:'f f'+n}, Array.from({length:9},(_,i)=>h('i',{class:PIPS[n].includes(i)?'':'o'})))));
  const wrap = h('div',{class:'die-wrap',role:'img','aria-label':'Dado'}, die);
  let spins = 0;
  wrap.roll = () => new Promise(res => {
    const n = 1 + Math.floor(Math.random()*6); spins += 2;
    const [rx, ry] = DIE_ROT[n];
    die.style.transform = `rotateX(${rx + 360*spins}deg) rotateY(${ry + 360*spins}deg)`;
    Sfx.dice(); wrap.setAttribute('aria-label','Dado: ' + n);
    setTimeout(() => res(n), reduced() ? 150 : 1250);
  });
  return wrap;
}

/* ---------------- PISOS (uno por nivel de Bloom) ---------------- */
const PASOS = ['1 · Diagnóstico y objetivos','2 · Indicadores','3 · Diseñar y aplicar instrumentos','4 · Recopilar y analizar','5 · Decidir','6 · Reflexionar y recomendar'];
const VOCES = {
  'Clarificar':['«¿Puedes contarme con tus palabras qué buscaste lograr en esta parte?»','«¿Qué información usaste para desarrollar esta idea?»','«Cuando escribes “impacto ambiental”, ¿a qué te refieres exactamente?»','«¿Cómo llegaste a este resultado? Explícame tu procedimiento.»'],
  'Valorar':['«Me parece muy claro tu propósito y la organización de tus ideas.»','«Usaste buenos ejemplos que fortalecen tu argumento.»','«Destaco que relacionaste el tema con una situación de tu barrio; eso lo hace cercano.»','«Tu gráfica permite entender los datos de un vistazo: es un gran acierto.»'],

/* 5 · EVALUAR */ {
  g:'oraculo', title:'Los Dados del Oráculo', syl:'PREN',
  intro:'«Una retroalimentación que transforma se sube peldaño a peldaño. Enciende las runas en orden y luego deja que mis dados decidan: en cada lanzamiento tendrás que juzgar cuál voz pertenece al peldaño que te toque… y cuál es solo un juicio disfrazado.»',
  hint:'El orden es: Clarificar → Valorar → Expresar inquietudes → Sugerir. Clarificar pide al estudiante que explique; Valorar reconoce algo concreto; Expresar inquietudes plantea una duda o preocupación para que él reflexione; Sugerir propone un camino. Un juicio descalifica y no deja nada por hacer.',
  clue:'Para ordenar las sílabas: la palabra clave nombra aquello para lo que se evalúa. «Evaluación para el …» (11 letras).',
  render(box, api){
    const STEPS = [['Clarificar','?'],['Valorar','✦'],['Expresar inquietudes','❖'],['Sugerir','✧']];
    const A = h('div',{class:'part'}), B = h('div',{class:'part',hidden:true});
    box.append(A,B);
    let seq = 0;
    const runes = h('div',{class:'runes'});
    const fa = h('div',{class:'feedback',hidden:true});
    function drawRunes(){
      runes.innerHTML = ''; seq = 0;
      shuffle(STEPS).forEach(([n,gl]) => {
        const r = h('button',{class:'rune','data-n':STEPS.findIndex(s=>s[0]===n)}, h('span',{class:'glyph',text:gl}), h('span',{text:n}), h('span',{class:'ord'}));
        r.addEventListener('click', () => {
          if (r.classList.contains('lit')) return;
          if (n === STEPS[seq][0]){ seq++; r.classList.add('lit'); r.querySelector('.ord').textContent = 'Peldaño ' + seq; Sfx.ok();
            if (seq === 4){ feedback(fa,'ok','¡La escalera brilla completa! Las runas te conceden una vida extra.'); giveLife(1, 'Las runas te conceden una vida extra.'); setTimeout(()=>{ A.hidden = true; B.hidden = false; }, 1100); } }
          else { feedback(fa,'bad','Esa runa no corresponde a este peldaño. Las runas se apagan.'); if (api.lose('Runa fuera de orden.')) drawRunes(); }
        });
        runes.append(r);
      });
    }
    A.append(h('h3',{text:'Parte 1 · Enciende la escalera'}), h('p',{text:'Toca las runas en el orden en que se sube la escalera de la retroalimentación. Un error apaga todas las runas y cuesta una vida; si las enciendes todas, las runas te regalan una vida extra.'}), runes, fa);
    drawRunes();

    /* Parte 2: juego de dados */
    const NEED = 5; let wins = 0, jokerUsed = false, busy = false;
    const used = {}; Object.keys(VOCES).forEach(k => used[k] = []);
    const take = cat => { if (used[cat].length >= VOCES[cat].length) used[cat] = []; const v = pick(VOCES[cat].filter(x=>!used[cat].includes(x))); used[cat].push(v); return v; };
    const die = makeDie();
    const pips = h('div',{class:'pips','aria-label':'Aciertos'});
    const drawPips = () => { pips.innerHTML = ''; for (let i=0;i<NEED;i++) pips.append(h('i',{class:i<wins?'on':''})); };
    const rollBtn = h('button',{class:'btn',id:'dice-roll'},'Lanzar el dado');
    const qbox = h('div',{class:'part',style:'width:100%'});
    const fb = h('div',{class:'feedback',hidden:true});
    function ask(face){
      qbox.innerHTML = '';
      if (face === 6 && !jokerUsed){
        jokerUsed = true; S.score += 50; const sc = $('#hud-score'); if (sc) sc.textContent = num(S.score);
        Sfx.coin(); feedback(fb,'ok','¡Comodín! El Oráculo te regala esta ronda y +50 puntos.'); win(); return;
      }
      if (face === 6) face = 1 + Math.floor(Math.random()*5);
      const target = face === 5 ? 'Juicio' : RUNGS[face-1];
      const others = shuffle(Object.keys(VOCES).filter(k=>k!==target)).slice(0,2);
      const opts = shuffle([[take(target),1], [take(others[0]),0], [take(others[1]),0]]);
      const q = face === 5 ? 'Cara 5 · ¿Cuál de estas voces NO es retroalimentación, sino un juicio?' : `Cara ${face} · ¿Cuál de estas voces pertenece al peldaño «${target}»?`;
      qbox.append(h('p',{style:'font-weight:700',text:q}), h('div',{class:'choices'}, opts.map(([t,ok]) => h('button',{class:'choice','data-ok':ok,text:t,onclick:()=>{
        qbox.innerHTML = '';
        if (ok){ Sfx.ok(); feedback(fb,'ok','¡Buen juicio! Ronda ganada.'); win(); }
        else { feedback(fb,'bad','Esa voz no era. Lanza de nuevo.'); if (api.lose('Voz equivocada.')) { rollBtn.disabled = false; } }
      }}))));
    }
    function win(){ wins++; drawPips(); if (wins >= NEED){ rollBtn.disabled = true; setTimeout(()=>api.pass(), 700); } else rollBtn.disabled = false; }
    rollBtn.addEventListener('click', async () => {
      if (busy) return; busy = true; rollBtn.disabled = true; fb.hidden = true; qbox.innerHTML = '';
      const n = await die.roll(); busy = false;
      if (!api.alive()) return;
      ask(n);
    });
    drawPips();
    B.append(h('h3',{text:'Parte 2 · Los dados del Oráculo'}),
      h('p',{text:`Lanza el dado. Según la cara, tendrás que reconocer entre tres voces la que corresponde. Gana ${NEED} rondas para superar el piso; cada error cuesta una vida.`}),
      h('div',{class:'dicebox'},
        h('div',{class:'faces-key'}, h('span',{}, h('b',{text:'1 '}),'Clarificar'), h('span',{}, h('b',{text:'2 '}),'Valorar'), h('span',{}, h('b',{text:'3 '}),'Expresar inquietudes'), h('span',{}, h('b',{text:'4 '}),'Sugerir'), h('span',{}, h('b',{text:'5 '}),'Detecta el juicio'), h('span',{}, h('b',{text:'6 '}),'Comodín (una vez)')),
        die, pips, rollBtn, fb, qbox));
  }

/* -------- componentes de reto reutilizables -------- */
function feedback(box, kind, msg){
  let fb = box.classList.contains('feedback') ? box : box.querySelector(':scope > .feedback.auto');
  if (!fb){ fb = h('div',{class:'feedback auto'}); box.append(fb); }
  fb.hidden = false; fb.classList.remove('ok','bad'); fb.classList.add(kind); fb.textContent = msg;
}
function classify(box, rows, options, api, onDone, seg2){
  const answers = new Map();
  const list = h('div',{class:'items'});
  shuffle(rows).forEach(([text, right]) => {
    const id = 'c' + Math.random().toString(36).slice(2,8);
    let ctrl;
    if (options.length <= 2){
      ctrl = h('div',{class:'seg' + (seg2?' v':''),role:'group','aria-label':'Opciones'});
      options.forEach(o => { const b = h('button',{'data-v':o[0],'data-o':o,'aria-pressed':'false',text:o}); b.addEventListener('click',()=>{ Sfx.click(); answers.set(id,o); ctrl.querySelectorAll('button').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-pressed', x===b); }); }); ctrl.append(b); });
    } else {
      ctrl = h('select',{id,'aria-label':'Elige una opción'}, h('option',{value:'',text:'— Elige —'}), options.map(o=>h('option',{value:o,text:o})));
      ctrl.addEventListener('change',()=>{ Sfx.click(); answers.set(id, ctrl.value); });
    }
    list.append(h('div',{class:'item','data-id':id,'data-r':right}, h('p',{text:text}), ctrl));
  });
  const fb = h('div',{class:'feedback',hidden:true});
  const btn = h('button',{class:'btn check'},'Comprobar');
  btn.addEventListener('click', () => {
    const items = [...list.children];
    const missing = items.filter(it => !answers.get(it.dataset.id)).length;
    if (missing){ feedback(fb,'bad',`Te faltan ${missing} por responder.`); return; }
    const good = items.filter(it => answers.get(it.dataset.id) === it.dataset.r).length;
    if (good === items.length){ feedback(fb,'ok',`¡${good} de ${items.length}! Todo correcto.`); btn.disabled = true; setTimeout(onDone, 600); }
    else { feedback(fb,'bad',`Acertaste ${good} de ${items.length}. Revisa y vuelve a intentarlo.`); api.lose('Respuesta incompleta.'); }
  });
  box.append(list, fb, h('div',{class:'row-actions'}, btn));
}
function mcq(box, qs, api, onDone){
  const wrap = h('div',{class:'items'});
  const groups = qs.map(([q, opts], qi) => {
    const name = 'q' + qi + Math.random().toString(36).slice(2,6);
    wrap.append(h('fieldset',{class:'mcq'}, h('legend',{class:'label',text:'Pregunta ' + (qi+1)}), h('p',{style:'margin:0;font-weight:600',text:q}),
      shuffle(opts).map(([t,ok],oi) => { const id = name+'-'+oi; return h('label',{for:id}, h('input',{type:'radio',name,id,value:ok,onchange:()=>Sfx.click()}), h('span',{text:t})); })));
    return name;
  });
  const fb = h('div',{class:'feedback',hidden:true});
  const btn = h('button',{class:'btn check'},'Comprobar');
  btn.addEventListener('click', () => {
    const vals = groups.map(n => { const c = box.querySelector(`input[name="${n}"]:checked`); return c ? c.value : null; });
    if (vals.includes(null)){ feedback(fb,'bad','Responde las tres preguntas.'); return; }
    const good = vals.filter(v => v === '1').length;
    if (good === qs.length){ feedback(fb,'ok','¡Mitos derribados!'); btn.disabled = true; setTimeout(onDone, 600); }
    else { feedback(fb,'bad',`Acertaste ${good} de ${qs.length}.`); api.lose('Respuesta incorrecta.'); }
  });
  box.append(wrap, fb, h('div',{class:'row-actions'}, btn));
}

/* -------- partida -------- */
function elapsed(){ return (Date.now() - S.runStart - S.pausedMs - (S.pauseAt ? Date.now() - S.pauseAt : 0)) / 1000; }
function pauseTimer(){ if (!S.pauseAt) S.pauseAt = Date.now(); }
function resumeTimer(){ if (S.pauseAt){ S.pausedMs += Date.now() - S.pauseAt; S.pauseAt = 0; } }
function startRun(){
  S.running = true; S.dead = false; S.pendingNext = false; S.pendingLives = 0; S.reto = 0; S.score = 0; S.clues = []; S.syls = []; S.runStart = Date.now(); S.pausedMs = 0; S.pauseAt = 0;
  clearInterval(S.timer); S.timer = setInterval(tickTimer, 1000);
  Sfx.startDrone(); renderReto();
}
function resumeRun(r){
  Object.assign(S, { docId:r.docId, nombre:r.nombre, grupo:r.grupo, reto:r.reto, score:r.score, clues:r.clues||[], syls:r.syls||[], restarts:r.restarts||0, bestScore:r.bestScore||0, giftsSeen:r.giftsSeen||0, pendingLives:r.pendingLives||0 });
  S.running = true; S.dead = false; S.pendingNext = false; S.runStart = Date.now() - r.elapsed*1000; S.pausedMs = 0; S.pauseAt = 0;
  clearInterval(S.timer); S.timer = setInterval(tickTimer, 1000);
  Sfx.unlock(); Sfx.startDrone(); renderReto();
}
function tickTimer(){
  if (!S.running || S.pauseAt) return;
  const left = TOTAL_SEC - elapsed();
  const t = $('#hud-time'); if (t){ t.textContent = fmtTime(left); t.parentElement.classList.toggle('low', left <= 120); }
  if (left <= 60 && left > 0) Sfx.tick();
  if (left <= 0) gameOver('Se agotó el tiempo de la expedición.');
  else if (Math.round(left) % 20 === 0) saveRun();
}

function confetti(){
  if (reduced()) return;
  const c = $('#confetti'); c.hidden = false; const x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#f3d998','#d6b36a','#9d7bff','#5fd4cf','#ff8fa3'];
  const ps = Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,vy:2+Math.random()*3,vx:-1+Math.random()*2,a:Math.random()*6,c:pick(cols)}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx+Math.sin(p.a+=.05); x.fillStyle=p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (t - t0 < 6000) requestAnimationFrame(f); else { x.clearRect(0,0,c.width,c.height); c.hidden = true; }
  })(t0);
}
/* brasas de fondo */
(function embers(){
  if (reduced()) return;
  const c = $('#embers'), x = c.getContext('2d'); let ps = [];
  const size = () => { c.width = innerWidth; c.height = innerHeight; ps = Array.from({length:Math.min(46, Math.round(innerWidth/28))},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:.6+Math.random()*1.8,v:.15+Math.random()*.45,a:Math.random()*6,g:Math.random()<.3})); };
  size(); addEventListener('resize', size);
  (function f(){
    if (!document.hidden){
      x.clearRect(0,0,c.width,c.height);
      ps.forEach(p=>{ p.y -= p.v; p.x += Math.sin(p.a += .01)*.3; if (p.y < -5){ p.y = c.height+5; p.x = Math.random()*c.width; }
        x.globalAlpha = .25 + .35*Math.abs(Math.sin(p.a*2)); x.fillStyle = p.g ? '#9d7bff' : '#f3d998'; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); });
    }
    requestAnimationFrame(f);
  })();
})();

/* ---------------- versión docente ---------------- */
function renderTeacherLogin(){
  show('teacherLogin');
  const pw = h('input',{id:'t-pass',type:'password',autocomplete:'off'});
  const err = h('div',{class:'err'});
  const form = h('form',{class:'reg',style:'max-width:440px;margin:0 auto'},
    h('img',{src:IMG.cronista,alt:'La Cronista',style:'width:150px;border-radius:8px;justify-self:center'}),
    h('h2',{style:'font-size:1.3rem;color:var(--gold2);text-align:center',text:'Archivo de la Cronista'}),
    h('p',{class:'note',style:'text-align:center;margin:0',text:'Acceso exclusivo para docentes.'}),
    h('div',{class:'field'}, h('label',{for:'t-pass',class:'label',text:'Contraseña'}), pw), err,
    h('button',{class:'btn',type:'submit'},'Entrar al panel'),
    h('button',{class:'btn ghost small',type:'button',onclick:renderIntro},'Volver'));
  form.addEventListener('submit', e => { e.preventDefault(); if (pw.value === PASS){ S.teacherOk = true; S.teacherKey = pw.value; Sfx.unlock(); renderTeacher(); Backend.refresh(); } else { err.textContent = 'Contraseña incorrecta.'; Sfx.bad(); pw.select(); } });
  app.append(h('div',{class:'wrap'}, form));
  pw.focus();
}
const COLS = [['nombre','Participante'],['grupo','Grupo'],['retosSuperados','Progreso'],['vidas','Vidas'],['puntos','Puntos actuales'],['mejorPuntaje','Mejor puntaje'],['reinicios','Reinicios'],['tiempoSeg','Tiempo final'],['estado','Estado'],['compromiso','Compromiso'],['actualizado','Última actividad']];
const NUMCOLS = ['puntos','mejorPuntaje','retosSuperados','reinicios','tiempoSeg','vidas'];
function renderTeacher(){
  const keepScroll = S.view === 'teacher' ? window.scrollY : 0;
  show('teacher'); S.confirming = false;
  const q = (S.filter||'').toLowerCase();
  const rows = players.filter(p => !q || ((p.nombre||'')+' '+(p.grupo||'')).toLowerCase().includes(q))
    .sort((a,b)=>{ const k=S.sort.k; if (NUMCOLS.includes(k)) return ((Number(a[k])||0)-(Number(b[k])||0))*S.sort.dir; return String(a[k]??'').localeCompare(String(b[k]??''),'es')*S.sort.dir; });
  const done = players.filter(p=>p.estado==='completado');
  const avg = done.length ? Math.round(done.reduce((s,p)=>s+(Number(p.mejorPuntaje)||0),0)/done.length) : 0;
  const avgT = done.length ? done.reduce((s,p)=>s+(Number(p.tiempoSeg)||0),0)/done.length : 0;
  const filter = h('input',{id:'t-filter',placeholder:'Buscar por nombre o grupo',value:S.filter||'',style:'max-width:320px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:9px 12px'});
  filter.addEventListener('input',()=>{ S.filter = filter.value; clearTimeout(S.ft); S.ft = setTimeout(()=>{ renderTeacher(); const f=$('#t-filter'); f.focus(); f.setSelectionRange(f.value.length,f.value.length); },300); });
  const stateLabel = p => p.estado==='completado' ? h('span',{class:'pill done',text:'Completó'}) : p.estado==='reiniciando' ? h('span',{class:'pill reset',text:'Reiniciando'}) : h('span',{class:'pill run',text:'En curso'});
  const table = h('table',{},
    h('thead',{}, h('tr',{}, COLS.map(([k,l])=>h('th',{}, h('button',{onclick:()=>{ S.sort = { k, dir: S.sort.k===k ? -S.sort.dir : (NUMCOLS.includes(k) ? -1 : 1) }; renderTeacher(); }}, l + (S.sort.k===k ? (S.sort.dir<0?' ↓':' ↑') : '')))), h('th',{text:''}))),
    h('tbody',{}, rows.length ? rows.map(p => {
      const del = h('button',{class:'btn danger small'},'Borrar');
      del.addEventListener('click',()=>{
        S.confirming = true;
        const cell = del.parentElement; cell.innerHTML = '';
        cell.append(h('span',{class:'note',text:'¿Seguro? '}), h('button',{class:'btn danger small',onclick:async()=>{ cell.textContent = 'Borrando…'; try{ await Backend.remove(p.id, S.teacherKey); players = players.filter(x=>x.id!==p.id); }catch(e){ console.warn(e); } S.confirming = false; renderTeacher(); }},'Sí'), ' ', h('button',{class:'btn ghost small',onclick:()=>{ S.confirming = false; renderTeacher(); }},'No'));
      });
      const sup = Number(p.retosSuperados)||0, fin = p.estado === 'completado';
      const gift = fin ? null : h('button',{class:'btn small','data-gift':p.id,title:'Enviar una vida extra a este participante'},'+1 vida');
      if (gift) gift.addEventListener('click', () => {
        const n = (Number(p.vidasExtra)||0) + 1; p.vidasExtra = n;
        Backend.save(p.id, { vidasExtra: n }, false);
        gift.disabled = true; gift.textContent = 'Vida enviada'; toast(`Vida extra enviada a ${p.nombre}. Le llegará en unos segundos.`);
      });
      return h('tr',{},
        h('td',{text:p.nombre||'—'}), h('td',{text:p.grupo||'—'}),
        h('td',{}, h('div',{class:'prog'}, Array.from({length:6},(_,i)=>h('i',{class:i<sup?'done':(!fin && i===sup?'now':'')}))), h('span',{class:'note',text: fin ? 'Escapó de la Torre' : `En el piso ${Math.min(6,sup+1)} · ${sup} superados`})),
        h('td',{class:'num',text: fin ? '—' : (p.vidas === '' || p.vidas == null ? '—' : '♥ ' + (Number(p.vidas)||0))}),
        h('td',{class:'num',text:num(p.puntos)}), h('td',{class:'num'}, h('b',{text:num(p.mejorPuntaje)})),
        h('td',{class:'num',text:Number(p.reinicios)||0}),
        h('td',{class:'num',text:Number(p.tiempoSeg)?fmtTime(p.tiempoSeg):'—'}), h('td',{}, stateLabel(p)),
        h('td',{}, p.compromiso ? h('span',{class:'quote',text:'«'+p.compromiso+'»'}) : h('span',{class:'note',text:'—'})),
        h('td',{class:'note',text:p.actualizado?new Date(p.actualizado).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'—'}),
        h('td',{}, h('div',{class:'row-actions',style:'flex-wrap:nowrap'}, gift, del)));
    }) : h('tr',{}, h('td',{colspan:COLS.length+1,class:'note',text: Backend.shared ? 'Todavía no hay participantes registrados. Cuando alguien se registre aparecerá aquí.' : Backend.offlineNote}))));
  table.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td,i) => { if (COLS[i] && td.colSpan === 1) td.dataset.label = COLS[i][1]; }));
  app.append(h('div',{class:'wrap screen'},
    h('div',{class:'foot',style:'border:0;padding:0'},
      h('div',{}, h('div',{class:'label',text:'Versión docente'}), h('h1',{style:'font-size:clamp(1.5rem,3vw,2.2rem);color:var(--gold2)',text:'Archivo de la Cronista'})),
      h('div',{class:'row-actions'}, Backend.canDownload ? h('button',{class:'btn ghost small',onclick:exportCsv},'Descargar CSV') : null, h('button',{class:'btn ghost small',onclick:()=>Backend.refresh()},'Actualizar'), h('button',{class:'btn ghost small',onclick:()=>{ S.teacherOk = false; renderIntro(); }},'Cerrar sesión docente'))),
    h('div',{class:'tiles'},
      h('div',{class:'tile'}, h('span',{class:'label',text:'Participantes'}), h('b',{text:players.length})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Escaparon'}), h('b',{text:done.length})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Puntaje promedio (escaparon)'}), h('b',{text:num(avg)})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Tiempo promedio'}), h('b',{text:done.length?fmtTime(avgT):'—'})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Reinicios totales'}), h('b',{text:players.reduce((s,p)=>s+(Number(p.reinicios)||0),0)}))),
    h('div',{class:'row-actions'}, filter, h('span',{class:'note',text:Backend.liveNote + ' Toca un encabezado para ordenar.'})),
    h('div',{class:'tablewrap teacher'}, table)));
  window.scrollTo(0, keepScroll);
}
async function exportCsv(){
  const esc = v => '"' + String(v??'').replace(/"/g,'""') + '"';
  const head = ['Participante','Grupo','Puntos actuales','Mejor puntaje','Pisos superados','Vidas','Vidas extra enviadas','Reinicios','Tiempo final (mm:ss)','Estado','Compromiso','Inicio','Última actividad'];
  const lines = [head.map(esc).join(';')].concat(players.map(p=>[p.nombre,p.grupo,p.puntos||0,p.mejorPuntaje||0,p.retosSuperados||0,p.vidas??'',p.vidasExtra||0,p.reinicios||0,Number(p.tiempoSeg)?fmtTime(p.tiempoSeg):'',p.estado,p.compromiso,p.inicio,p.actualizado].map(esc).join(';')));
  try { await Backend.download('torre-evaluacion-resultados.csv', '\ufeff' + lines.join('\r\n')); } catch(e){ console.warn(e); }
}
addEventListener('beforeunload', () => saveRun());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveRun(); });

renderIntro();
</script>
