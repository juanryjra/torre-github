<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Torre de la Evaluación</title>
<meta name="description" content="Escape room interactivo sobre evaluación para el aprendizaje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: una torre oscura; HUD fijo arriba, guardián a la izquierda y reto a la derecha (se apilan en móvil). Tema único oscuro, a propósito. */
:root{
  --bg:#0c0b12; --bg2:#13111c; --panel:#1a1726; --panel2:#221e31; --line:#3a3350;
  --fg:#ebe4d6; --muted:#a49cb5; --gold:#d6b36a; --gold2:#f3d998; --violet:#9d7bff; --teal:#5fd4cf;
  --ok:#62d48d; --bad:#ff6b6b; --warn:#ffb454;
  --f-title:"Cinzel Decorative","Cinzel",Georgia,serif; --f-head:"Cinzel",Georgia,serif; --f-body:"Alegreya",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a1f45 0%,transparent 60%),radial-gradient(900px 500px at 0% 110%,#1d2a33 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:18px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;font-weight:700;letter-spacing:.02em}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.screen{display:grid;gap:24px}
.label{font-family:var(--f-head);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:linear-gradient(180deg,#3b2f17,#241c0e);color:var(--gold2);font-family:var(--f-head);font-weight:700;letter-spacing:.06em;padding:12px 22px;border-radius:6px;transition:transform .12s,box-shadow .2s}
.btn:hover{box-shadow:0 0 18px rgba(214,179,106,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.small{padding:7px 12px;font-size:.8rem}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.field{display:grid;gap:6px}
.field input,.field textarea,select{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:11px 12px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.note{font-size:.88rem;color:var(--muted)}
.err{color:var(--bad);font-size:.92rem;min-height:1.3em}

/* ---------- Intro ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
.hero-title{font-family:var(--f-title);font-weight:900;font-size:clamp(2.1rem,5.4vw,3.9rem);line-height:1.05;color:var(--gold2);text-shadow:0 0 28px rgba(157,123,255,.35)}
.hero-title span{display:block;font-size:.42em;letter-spacing:.32em;color:var(--violet);font-family:var(--f-head);margin-bottom:10px;text-shadow:none}
.lore{max-width:62ch;color:#d9d1c2}
.portal{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
.portal img{display:block;width:100%;height:auto}
.portal .cap{position:absolute;inset:auto 0 0;padding:14px 16px;background:linear-gradient(transparent,rgba(8,7,12,.92));font-size:.92rem}
.reg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:14px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rule{border-top:1px solid var(--line);padding-top:10px;font-size:.95rem}
.rule b{display:block;font-family:var(--f-head);color:var(--gold);font-size:.82rem;letter-spacing:.08em}
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.board ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding:4px 0;font-variant-numeric:tabular-nums}
.board li .n{font-family:var(--f-head);color:var(--gold)}
.board li .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .who small{color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,11,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.hud .stat{display:grid;line-height:1.15}
.hud .stat b{font-family:var(--f-head);font-size:1.05rem;font-variant-numeric:tabular-nums}
.hud .timer b{font-size:1.35rem;color:var(--teal)}
.hud .timer.low b{color:var(--bad);animation:pulse 1s infinite}
.hearts{display:flex;gap:4px}
.heart{width:20px;height:18px;position:relative}
.heart::before,.heart::after{content:"";position:absolute;top:0;width:10px;height:16px;border-radius:10px 10px 0 0;background:var(--bad)}
.heart::before{left:10px;transform:rotate(-45deg);transform-origin:0 100%}
.heart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
.heart.off::before,.heart.off::after{background:#3a3248}
.steps{display:flex;gap:5px}
.steps i{width:22px;height:6px;border-radius:3px;background:#2b2540}
.steps i.done{background:var(--gold)}
.steps i.now{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.hud .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 11px;font-family:var(--f-head);font-size:.8rem}

/* ---------- Escena ---------- */
.scene{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.guard{position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.guard img{display:block;width:100%;height:auto;aspect-ratio:300/422;object-fit:cover}
.guard .gtxt{padding:14px 16px 18px;display:grid;gap:8px}
.guard h3{color:var(--gold2);font-size:1.05rem}
.speech{font-style:italic;color:#d8d0e6;font-size:.98rem}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:18px;min-width:0}
.stage h2{font-size:clamp(1.3rem,2.6vw,1.75rem);color:var(--gold2)}
.part{display:grid;gap:14px}
.feedback{padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);font-size:.98rem}
.feedback.ok{border-color:var(--ok);color:var(--ok)}
.feedback.bad{border-color:var(--bad);color:#ffb3b3}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hintbox{border-left:3px solid var(--violet);padding:8px 12px;background:rgba(157,123,255,.08);font-size:.95rem}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pulse{50%{opacity:.45}}

/* pergamino */
.scroll{margin:0;background:linear-gradient(180deg,#f3e6c4,#e8d6a8);color:#2b2112;border-radius:6px;padding:20px 22px;line-height:2.3;font-size:1.05rem;box-shadow:inset 0 0 30px rgba(120,80,20,.25)}
.scroll select{display:inline-block;width:auto;max-width:100%;background:#fff8e6;color:#2b2112;border:1px solid #9c7a3c;padding:3px 8px;margin:2px 0;font-weight:600}
.scroll footer{margin-top:8px;font-size:.85rem;font-style:italic;line-height:1.4;color:#5a4320}
/* clasificación */
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.item p{margin:0}
.item select{width:auto;min-width:170px;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font-family:var(--f-head);font-size:.8rem;letter-spacing:.05em}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--gold);color:#1c150a}
.seg.v button.on[data-v="F"]{background:var(--teal)}
.seg.v button.on[data-v="S"]{background:var(--violet);color:#fff}
.mcq{display:grid;gap:8px;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.mcq label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px;border-radius:6px;cursor:pointer}
.mcq label:hover{background:rgba(255,255,255,.04)}
.mcq input{margin-top:6px;accent-color:var(--gold)}

/* engranajes */
.gears{display:grid;gap:8px;counter-reset:g}
.gear{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.gear .pos{font-family:var(--f-head);color:var(--gold);font-size:1.1rem;text-align:center}
.gear .ctr{display:flex;gap:4px}
.gear .ctr button{border:1px solid var(--line);background:var(--panel2);border-radius:5px;width:34px;height:34px}
.gear .ctr button.x{width:auto;padding:0 8px;font-size:.78rem;font-family:var(--f-head)}
.discard{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;min-height:56px}
.discard .gear{opacity:.7}

/* runas escalera */
.runes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rune{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:16px 10px;font-family:var(--f-head);font-weight:700;display:grid;gap:6px;justify-items:center;text-align:center;font-size:.9rem}
.rune .glyph{font-size:1.8rem;color:var(--violet)}
.rune.lit{border-color:var(--gold);box-shadow:0 0 16px rgba(214,179,106,.4)}
.rune.lit .glyph{color:var(--gold2)}
.rune .ord{font-size:.75rem;color:var(--gold)}

/* cerradura */
.lock{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.dial{display:grid;gap:6px;justify-items:center}
.dial button{width:52px;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:6px}
.dial .d{width:64px;height:78px;display:grid;place-items:center;font-family:var(--f-title);font-size:2.3rem;color:var(--teal);background:#0a0f13;border:2px solid #2d4a50;border-radius:10px;box-shadow:inset 0 0 18px rgba(95,212,207,.25);font-variant-numeric:tabular-nums}

/* grimorio */
.grimoire{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,env(safe-area-inset-right,0px));width:min(420px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#17131f;border:1px solid var(--gold);border-radius:10px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:grid;gap:12px}
.grimoire ol{margin:0;padding-left:1.3em;display:grid;gap:10px}
.grimoire li::marker{color:var(--gold);font-family:var(--f-head)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,9,.82);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:26px;display:grid;gap:14px;text-align:center;justify-items:center;box-shadow:0 0 60px rgba(157,123,255,.25)}
.modal img{width:160px;border-radius:8px;border:1px solid var(--line)}
.modal h2{color:var(--gold2);font-size:1.6rem}
.clue{border:1px dashed var(--gold);border-radius:8px;padding:12px 14px;background:rgba(214,179,106,.07);text-align:left;width:100%}

/* final */
.seal{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b650 40%,#8a6420 75%);box-shadow:0 0 50px rgba(243,217,152,.6),inset 0 -8px 20px rgba(0,0,0,.35);animation:glow 2.4s ease-in-out infinite;color:#4a3410;font-family:var(--f-title);font-weight:900;font-size:1.05rem;text-align:center;line-height:1.1;padding:20px}
@keyframes glow{50%{box-shadow:0 0 80px rgba(243,217,152,.9),inset 0 -8px 20px rgba(0,0,0,.35)}}
.win{display:grid;justify-items:center;text-align:center;gap:18px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:30px 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left}
.tile b{display:block;font-family:var(--f-head);font-size:1.6rem;color:var(--gold2);font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* docente */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.92rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-head);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg2);position:sticky;top:0}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-family:var(--f-head);border:1px solid}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.run{color:var(--warn);border-color:var(--warn)}
.pill.reset{color:var(--bad);border-color:var(--bad)}
.quote{font-style:italic;color:#d8d0e6;max-width:36ch}
.sync{font-size:.82rem;color:var(--muted)}
.sync.off{color:var(--warn)}

@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .scene{grid-template-columns:minmax(0,1fr)}
  .guard{position:static;display:grid;grid-template-columns:110px minmax(0,1fr)}
  .guard img{height:100%;aspect-ratio:auto}
  .item{grid-template-columns:minmax(0,1fr)}
  .item select{width:100%}
}
@media (max-width:520px){
  body{font-size:17px}
  .runes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
const IMG = Object.fromEntries(['tiempo','duende','inventor','alquimista','oraculo','golem','sombra','cronista'].map(n => [n, 'img/' + n + '.jpg']));
const PASS = "santillana2026";
const TOTAL_SEC = 30 * 60;
const MAX_LIVES = 3;

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtTime = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

/* ---------------- sonido (Web Audio, sin archivos) ---------------- */
const Sfx = (() => {
  let ctx = null, master = null, drone = null, muted = store.get('torre-mute') === '1';
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, dur, type='sine', vol=.25, when=0, slide=null){
    if (muted) return; const c = ac(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function startDrone(){
    if (muted || drone) return; const c = ac(); if (!c) return;
    const g = c.createGain(); g.gain.value = .0001; g.gain.exponentialRampToValueAtTime(.07, c.currentTime+3);
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 420;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .08; lg.gain.value = 160; lfo.connect(lg); lg.connect(lp.frequency);
    const os = [55, 82.4, 110.6].map((f,i)=>{ const o=c.createOscillator(); o.type = i===1?'triangle':'sawtooth'; o.frequency.value=f; o.detune.value = i*6; o.connect(lp); o.start(); return o; });
    lp.connect(g); g.connect(master); lfo.start();
    drone = {g, os, lfo};
  }
  function stopDrone(){ if (!drone) return; const c = ac(); drone.g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+.6); const d = drone; drone = null; setTimeout(()=>{ d.os.forEach(o=>o.stop()); d.lfo.stop(); }, 800); }
  return {
    get muted(){ return muted; },
    toggle(){ muted = !muted; store.set('torre-mute', muted?'1':'0'); if (muted) stopDrone(); else if (S.running) startDrone(); return muted; },
    startDrone, stopDrone,
    click(){ tone(700,.07,'triangle',.12); },
    flip(){ tone(380,.12,'triangle',.14,0,720); },
    ok(){ [523,659,784].forEach((f,i)=>tone(f,.28,'triangle',.22,i*.08)); },
    bad(){ tone(196,.4,'sawtooth',.18,0,92); tone(147,.45,'square',.06,.05,70); },
    unlock(){ [392,523,659,784,1046].forEach((f,i)=>tone(f,.45,'triangle',.2,i*.1)); tone(1568,.9,'sine',.08,.5); },
    tick(){ tone(1250,.04,'square',.06); },
    gameover(){ [392,330,262,196,131].forEach((f,i)=>tone(f,.55,'sawtooth',.14,i*.22)); },
    win(){ const m=[[523,0],[659,.14],[784,.28],[1046,.42],[784,.62],[1046,.76],[1318,.95]]; m.forEach(([f,t])=>{ tone(f,.5,'triangle',.22,t); tone(f/2,.5,'sine',.1,t); }); tone(1568,1.6,'sine',.1,1.2); }
  };
})();

/* ---------------- registro compartido (Google Sheets vía Apps Script) ---------------- */
const API = String((window.TORRE_CONFIG && window.TORRE_CONFIG.urlRegistro) || '').trim();
const LOCAL_KEY = 'torre-jugadores';
const NUMS = ['puntos','mejorPuntaje','retoActual','retosSuperados','reinicios','tiempoSeg','bonoTiempo'];
let players = [], dbq = Promise.resolve(), syncOk = true;
function localAll(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); } catch(e){ return {}; } }
function localPut(all){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all)); } catch(e){} }
function setSync(ok){ syncOk = ok; }
async function post(body){
  const r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error'); return j;
}
function saveRemote(patch){
  if (!S.docId) return;
  const id = S.docId, body = Object.assign({}, patch, { actualizado: new Date().toISOString() });

/* -------- componentes de reto reutilizables  -------- */
function feedback(box, kind, msg){
  let fb = box.classList.contains('feedback') ? box : box.querySelector(':scope > .feedback.auto');
  if (!fb){ fb = h('div',{class:'feedback auto'}); box.append(fb); }
  fb.hidden = false; fb.classList.remove('ok','bad'); fb.classList.add(kind); fb.textContent = msg;
}
function classify(box, rows, options, api, onDone, seg2){
  const answers = new Map();
  const list = h('div',{class:'items'});
  shuffle(rows).forEach(([text, right], idx) => {
    const id = 'c' + Math.random().toString(36).slice(2,8);
    let ctrl;
    if (options.length <= 2){
      ctrl = h('div',{class:'seg' + (seg2?' v':''),role:'group','aria-label':'Opciones'});
      options.forEach(o => { const b = h('button',{'data-v':o[0],text:o}); b.addEventListener('click',()=>{ Sfx.click(); answers.set(id,o); ctrl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }); ctrl.append(b); });
    } else {
      ctrl = h('select',{id,'aria-label':'Elige una opción'}, h('option',{value:'',text:'— Elige —'}), options.map(o=>h('option',{value:o,text:o})));
      ctrl.addEventListener('change',()=>{ Sfx.click(); answers.set(id, ctrl.value); });
    }
    list.append(h('div',{class:'item','data-id':id,'data-r':right}, h('p',{text:text}), ctrl));
  });
  const fb = h('div',{class:'feedback',hidden:true});
  const btn = h('button',{class:'btn'},'Comprobar');
  btn.addEventListener('click', () => {
    const items = [...list.children];
    const missing = items.filter(it => !answers.get(it.dataset.id)).length;
    if (missing){ feedback(fb,'bad',`Te faltan ${missing} por responder.`); return; }
    const good = items.filter(it => answers.get(it.dataset.id) === it.dataset.r).length;
    if (good === items.length){ feedback(fb,'ok',`¡${good} de ${items.length}! Todo correcto.`); btn.disabled = true; setTimeout(onDone, 600); }
    else { feedback(fb,'bad',`Acertaste ${good} de ${items.length}. Revisa y vuelve a intentarlo.`); api.lose('Respuesta incompleta.'); }
  });
  box.append(list, fb, h('div',{class:'row-actions'}, btn));
}
function mcq(box, qs, api, onDone){

  const groups = qs.map(([q, opts], qi) => {

        h('td',{class:'note',text:p.actualizado?new Date(p.actualizado).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'—'}),
        h('td',{}, del));
    }) : h('tr',{}, h('td',{colspan:COLS.length+1,class:'note',text: API ? 'Todavía no hay participantes registrados. La tabla se actualiza cada 10 segundos.' : 'Modo de prueba: solo se ven los participantes de este dispositivo. Configura config.js para ver a todos.'}))));
  const csvBtn = h('button',{class:'btn ghost small',onclick:exportCsv},'Descargar CSV');
  app.append(h('div',{class:'wrap screen'},
    h('div',{class:'foot',style:'border:0;padding:0'},
      h('div',{}, h('div',{class:'label',text:'Versión docente'}), h('h1',{style:'font-size:clamp(1.5rem,3vw,2.2rem);color:var(--gold2)',text:'Archivo de la Cronista'})),
      h('div',{class:'row-actions'}, csvBtn, h('button',{class:'btn ghost small',onclick:()=>{ S.teacherOk = false; renderIntro(); }},'Cerrar sesión docente'))),
    h('div',{class:'tiles'},
      h('div',{class:'tile'}, h('span',{class:'label',text:'Participantes'}), h('b',{text:players.length})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Escaparon'}), h('b',{text:done.length})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Puntaje promedio (escaparon)'}), h('b',{text:avg.toLocaleString('es-CO')})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Tiempo promedio'}), h('b',{text:done.length?fmtTime(avgT):'—'})),
      h('div',{class:'tile'}, h('span',{class:'label',text:'Reinicios totales'}), h('b',{text:players.reduce((s,p)=>s+(p.reinicios||0),0)}))),
    h('div',{class:'row-actions'}, filter, h('span',{class:'note',text:'Se actualiza cada 10 segundos. Toca un encabezado para ordenar.'}), h('button',{class:'btn ghost small',onclick:loadPlayers},'Actualizar ahora')),
    h('div',{class:'tablewrap'}, table)));
  window.scrollTo(0, keepScroll);
}
async function exportCsv(){
  const esc = v => '"' + String(v??'').replace(/"/g,'""') + '"';
  const head = ['Participante','Grupo','Puntos actuales','Mejor puntaje','Retos superados','Reinicios','Tiempo final (mm:ss)','Estado','Compromiso','Inicio','Última actividad'];
  const lines = [head.map(esc).join(';')].concat(players.map(p=>[p.nombre,p.grupo,p.puntos||0,p.mejorPuntaje||0,p.retosSuperados||0,p.reinicios||0,p.tiempoSeg?fmtTime(p.tiempoSeg):'',p.estado,p.compromiso,p.inicio,p.actualizado].map(esc).join(';')));
  const url = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }));
  const a = h('a',{href:url,download:'torre-evaluacion-resultados.csv'}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

renderIntro();
</script>
